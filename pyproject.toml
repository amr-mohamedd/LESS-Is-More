[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "less-is-more"
version = "0.1.0"
description = "LESS Is More: Mutual-Stability Sampling for Diffusion Language Models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amr Mohamed" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.46",
    "accelerate>=1.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
eval = [
    "lm_eval>=0.4.9",
    "datasets>=2.18",
    "regex>=2024.0",
]

[project.urls]
Repository = "https://github.com/amr-mohamedd/LESS-Is-More"

[tool.setuptools]
py-modules = ["model_adapter", "less_core"]

[tool.setuptools.packages.find]
include = ["dream_sampling*", "llada_sampling*"]
